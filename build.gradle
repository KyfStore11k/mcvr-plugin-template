buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.loom_version}"
    }
}

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'de.undercouch.download' version '5.6.0'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20-Beta1'
}

apply plugin: "net.fabricmc.fabric-loom${project.loom_type}"

group = project.group
version = project.version

repositories {
    mavenCentral()
}

def zipName = "v${project.mcvr_mc_version}.zip"
def downloadedZipFile = layout.projectDirectory.dir('libs/').file(zipName).asFile
def outputJarDir = layout.buildDirectory.dir('extracted-libs')

tasks.register('downloadGithubJar', de.undercouch.gradle.tasks.download.Download) {
    src "https://nightly.link/KyfStore11k/MCVersionRenamer/workflows/build/master/v${project.mcvr_mc_version}.zip"
    dest downloadedZipFile
    overwrite true
}

tasks.register('extractJar', Copy) {
    dependsOn downloadGithubJar
    from zipTree(downloadedZipFile)
    into outputJarDir
    include '**/*.jar'
}

tasks.compileJava.dependsOn extractJar
tasks.shadowJar.dependsOn jar

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

afterEvaluate {
    tasks.genSourcesWithCfr.mustRunAfter shadowJar
}

configurations {
    shadowOnly
    compileOnly.extendsFrom(shadowOnly)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.mcvr_mc_version}"
    //mappings loom.layered() {
    //    officialMojangMappings()
    //}

    implementation fileTree(dir: outputJarDir).builtBy(extractJar)

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveBaseName.set("MCVRPluginTemplate")
    archiveVersion.set("")

    manifest {
        attributes(
                "Plugin-Id":  "mcvr-plugin-template",
                "Plugin-Main": "com.kyfstore.mcvrplugintemplate.PluginTemplateInitializer",
                "Plugin-Depends": ""
        )
    }
}

shadowJar {
    archiveBaseName.set("MCVRPluginTemplate")
    archiveVersion.set("")

    configurations = [project.configurations.shadowOnly]

    manifest {
        attributes(
                "Plugin-Id":  "mcvr-plugin-template",
                "Plugin-Main": "com.kyfstore.mcvrplugintemplate.PluginTemplateInitializer",
                "Plugin-Depends": ""
        )
    }
}